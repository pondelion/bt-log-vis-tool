[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-log-vis-tool"
version = "0.1.0"
description = "Backtest Log Visualization Tool - バックテスト実験管理・可視化ツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "universal-pathlib>=0.2.5",
    "gcsfs>=2024.10.0",
    "authlib>=1.3.2,<1.6.6",  # 1.6.6以降はStreamlitのTornadoIntegration(session=None)と非互換
    # (FrameworkIntegration.set_state_dataがcache使用時もsession[key]=...を呼ぶようになり、
    #  session=NoneだとTypeError: 'NoneType' object does not support item assignmentになる。
    #  1.6.5で固定検証済み。streamlit側の対応版が出たら見直すこと)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
btlog-dashboard = "bt_log_vis_tool.app:main"

[tool.setuptools.packages.find]
include = ['bt_log_vis_tool']

[tool.ruff]
lint.select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # error
    "W",  # warning
    "UP",
]
lint.ignore = []
lint.fixable = ["ALL"]
exclude = [
    ".ruff_cache",
    ".venv"
]
line-length = 300
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
